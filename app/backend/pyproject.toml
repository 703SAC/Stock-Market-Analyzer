[project]
name = "stock-market-analyzer-backend"
version = "0.1.0"
description = "주식 AI 에이전트 시스템 백엔드 (모니터링/시장판단/전략 3대 에이전트)"
readme = "../../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "openai>=1.55.0",
    "google-genai>=1.0.0",
    "trafilatura>=1.12.0",
    "feedparser>=6.0.0",
    "apscheduler>=3.10.0",
    "pyyaml>=6.0.0",
    "pycryptodome>=3.21.0",
    "requests>=2.32.0",
    "websockets>=13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
